name: LooseningWorry

options:
  bundleIdPrefix: com.spencerfeng
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6"
    DEVELOPMENT_TEAM: 6XHT3APZP2
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  LooseningWorry:
    type: application
    platform: iOS
    sources:
      - LooseningWorry
    info:
      path: LooseningWorry/Info.plist
      properties:
        UIAppFonts:
          - Figtree-Regular.ttf
          - Figtree-SemiBold.ttf
          - Figtree-Bold.ttf
          - Figtree-ExtraBold.ttf
        # Shown the first time the app lock asks for Face ID.
        NSFaceIDUsageDescription: Face ID keeps your loops and notes private.
        # CloudKit pushes remote changes silently; this lets SwiftData pick them up in the background.
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: LooseningWorry/LooseningWorry.entitlements
      properties:
        aps-environment: development
        # Must match AppModelContainer.iCloudContainer.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.spencerfeng.looseningworry
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spencerfeng.looseningworry
        PRODUCT_NAME: LooseningWorry
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Loosening Worry
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  LooseningWorryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LooseningWorryTests
    dependencies:
      - target: LooseningWorry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spencerfeng.looseningworry.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LooseningWorry.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LooseningWorry
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  LooseningWorry:
    build:
      targets:
        LooseningWorry: all
        LooseningWorryTests: [test]
    test:
      targets:
        - LooseningWorryTests
      gatherCoverageData: true
      environmentVariables:
        # Where the compiler writes the app target's extracted strings; LocalizationCatalogTests reads them.
        LOCALIZATION_STRINGSDATA_DIR: $(OBJROOT)/LooseningWorry.build/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/LooseningWorry.build
      coverageTargets:
        - LooseningWorry
